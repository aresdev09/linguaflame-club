# Конфигурация Alembic. Адрес базы берётся из DATABASE_URL (или .env) в migrations/env.py.

[alembic]
# Путь к скриптам миграций относительно этого файла.
script_location = %(here)s/migrations

# Путь, добавляемый в sys.path при запуске (нужны импорты bot.*).
prepend_sys_path = .

path_separator = os

# Адрес БД задаёт env.py: пустое значение здесь — намеренно.
sqlalchemy.url =

[post_write_hooks]

# Логирование Alembic (используется только env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
